<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문제 풀이 뷰어</title>
<style>
:root {
  --bg: #f4f1ea;
  --card: #fffdf8;
  --ink: #2b2b2b;
  --muted: #8a8170;
  --line: #e3ddcf;
  --accent: #3b6ea5;
  --good: #2e7d4f;
  --bad: #c0392b;
  --reveal: #f3e9c6;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  line-height: 1.7;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

#topbar {
  position: sticky;
  top: 0;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  z-index: 10;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
}
.controls #title { margin-right: auto; font-size: 15px; }
select, button {
  font: inherit;
  font-size: 13px;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
  cursor: pointer;
}
button:hover { background: #f0ebdd; }
.progress-text { font-size: 13px; color: var(--muted); margin-left: 4px; }
.progressbar {
  height: 4px;
  background: var(--line);
}
#progressFill {
  height: 100%;
  width: 0;
  background: var(--accent);
  transition: width .2s ease;
}

main {
  flex: 1;
  display: flex;
  justify-content: center;
  padding: 24px 16px;
}
#card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 6px 24px rgba(0,0,0,.06);
  width: 100%;
  max-width: 760px;
  padding: 28px 32px 36px;
  cursor: pointer;
}

.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 14px; }
.q-number { font-weight: 700; font-size: 18px; color: var(--accent); margin-right: 4px; }
.tag {
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 999px;
  background: #eee7d6;
  color: #6b5f44;
}
.tag.tier { background: #e4eef7; color: #2c5e8f; }
.tag.source { background: #efe7f3; color: #6b4a7a; }

.stem { font-size: 19px; margin: 6px 0 14px; line-height: 1.5; }
.passage {
  background: #faf7ef;
  border-left: 3px solid var(--accent);
  padding: 12px 16px;
  border-radius: 6px;
  margin-bottom: 18px;
  white-space: pre-wrap;
  font-size: 15px;
}
.passage:empty { display: none; }

.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  transition: background .15s, border-color .15s;
}
.option .num { font-weight: 700; color: var(--accent); flex: 0 0 auto; }
.option.correct { background: #e8f5ec; border-color: var(--good); }
.option.wrong { background: #fbeae8; border-color: var(--bad); }
.option.chosen:not(.correct):not(.wrong) { border-color: var(--accent); }

.reveal-btn {
  margin-top: 18px;
  background: var(--accent);
  color: #fff;
  border: none;
  font-size: 15px;
  padding: 12px 18px;
}
.reveal-btn:hover { background: #325d8c; }

.answer-panel {
  margin-top: 18px;
  background: var(--reveal);
  border: 1px solid #e3d49a;
  border-radius: 10px;
  padding: 16px 18px;
}
.answer-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.answer-label {
  font-size: 12px; font-weight: 700; color: #8a6d00;
  background: #fff; border: 1px solid #e3d49a; border-radius: 6px; padding: 2px 8px;
}
.answer-text { font-size: 18px; font-weight: 700; color: #6b5300; }
.explanation { font-size: 14px; color: #4a4434; white-space: pre-wrap; }

.mark-row { display: flex; gap: 10px; margin-top: 14px; }
.mark { flex: 1; }
.mark.correct { background: #e8f5ec; border-color: var(--good); color: var(--good); }
.mark.wrong { background: #fbeae8; border-color: var(--bad); color: var(--bad); }
.mark.active { outline: 2px solid currentColor; }

.hidden { display: none !important; }

#navbar {
  display: flex;
  justify-content: center;
  gap: 16px;
  padding: 12px;
  border-top: 1px solid var(--line);
  background: var(--card);
}
#navbar button { font-size: 15px; padding: 10px 22px; }
.hint {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  margin: 0 0 12px;
}

.drop-hint {
  position: fixed;
  inset: 0;
  background: rgba(244, 241, 234, .96);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  text-align: center;
}
.drop-hint.dragover { background: rgba(59, 110, 165, .12); outline: 3px dashed var(--accent); outline-offset: -16px; }
.drop-inner h3 { margin: 0 0 12px; font-size: 20px; }
.drop-inner p { margin: 8px 0; }
.drop-inner .sub { font-size: 13px; color: var(--muted); }
.drop-inner code { background: #eee7d6; padding: 1px 6px; border-radius: 5px; }

/* 서답형 입력 */
.essay-input {
  width: 100%;
  min-height: 110px;
  margin-top: 16px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  font: inherit;
  font-size: 15px;
  line-height: 1.6;
  resize: vertical;
  background: #fff;
  color: var(--ink);
}
.essay-input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
.user-answer {
  margin-top: 12px;
  font-size: 14px;
  color: #4a4434;
  background: #faf7ef;
  border-left: 3px solid var(--muted);
  padding: 8px 12px;
  border-radius: 6px;
  white-space: pre-wrap;
}
.user-answer .ua-label { font-weight: 700; color: var(--muted); margin-right: 6px; }

/* 정답과 다른 부분 하이라이트 */
.diff-box { margin-top: 6px; }
.diff {
  color: var(--bad);
  font-weight: 700;
  background: #fbeae8;
  border-radius: 4px;
  padding: 0 2px;
}

/* 객관식 자동 판정 배지 */
.auto-status { margin-top: 10px; font-weight: 700; font-size: 15px; }
.auto-status.ok { color: var(--good); }
.auto-status.no { color: var(--bad); }
.auto-status.none { color: var(--muted); font-weight: 400; font-size: 13px; }



</style>
</head>
<body>
<header id="topbar">
  <div class="controls">
    <strong id="title">문제 풀이</strong>
    <select id="subjectFilter" title="과목 필터"></select>
    <select id="typeFilter" title="유형 필터"></select>
    <button id="loadBtn" type="button">📂 MD 불러오기</button>
    <button id="exportBtn" type="button">📤 공유 HTML</button>
    <button id="shuffleBtn" type="button">🔀 셔플</button>
    <button id="wrongBtn" type="button">📕 오답노트</button>
    <button id="resetBtn" type="button">↺ 진도초기화</button>
    <input type="file" id="fileInput" accept=".md,.markdown,.txt" multiple hidden>
    <span id="progress" class="progress-text">0 / 0</span>
  </div>
  <div class="progressbar"><div id="progressFill"></div></div>
</header>

<main>
  <section id="card" aria-live="polite">
    <div class="meta">
      <span id="qNumber" class="q-number"></span>
      <span id="qType" class="tag"></span>
      <span id="qTier" class="tag tier"></span>
      <span id="qSource" class="tag source"></span>
    </div>
    <h2 id="stem" class="stem"></h2>
    <div id="passage" class="passage"></div>
    <div id="options" class="options"></div>
    <div id="essayBox" class="essay-box hidden">
      <textarea id="userAnswer" class="essay-input" placeholder="답을 직접 입력해 보세요"></textarea>
      <button id="revealBtn" type="button" class="reveal-btn">비교 / 정답 보기</button>
    </div>
    <div id="answerPanel" class="answer-panel hidden">
      <div class="answer-head">
        <span class="answer-label">정답</span>
        <span id="answerText" class="answer-text"></span>
      </div>
      <div id="autoStatus" class="auto-status hidden"></div>
      <div id="diffBox" class="diff-box hidden"></div>
      <div id="explanation" class="explanation"></div>
      <div class="mark-row" id="markRow">
        <button id="correctBtn" type="button" class="mark correct">✅ 맞았어요</button>
        <button id="wrongMarkBtn" type="button" class="mark wrong">❌ 틀렸어요</button>
      </div>
    </div>
  </section>
</main>

<nav id="navbar">
  <button id="prevBtn" type="button">← 이전</button>
  <button id="nextBtn" type="button">다음 →</button>
</nav>

<p class="hint">← / → : 이동 &nbsp;·&nbsp; 스페이스 : 정답 공개 &nbsp;·&nbsp; 카드 클릭 : 정답 공개</p>

<div id="dropHint" class="drop-hint hidden">
  <div class="drop-inner">
    <h3>문제 MD를 여기로 끌어다 놓으세요</h3>
    <p>또는 <button id="dropLoadBtn" type="button" class="reveal-btn">MD 파일 선택</button></p>
    <p class="sub">output/ 의 <code>*.md</code> 를 그대로 올리면 됩니다. (Python 변환 불필요)</p>
  </div>
</div>

<script>
// parser.js — 마크다운 문제지를 브라우저에서 직접 파싱.
// tools/md2quiz.py 와 동일 로직. output/*.md 를 굳이 변환 안 거치고
// 웹에서 드래그앤드롭/파일선택으로 바로 불러오기 위함.
(function () {
  "use strict";

  var OPTION_RE = /^\s*([①②③④⑤])\s*(.*)$/m;
  var PROB_RE = /^\s*\*\*(\d+)\.\*\*\s*(.*)$/m;
  var TAG_RE = /\[([A-Za-z0-9\-]+)·?(T\d)\s*\]/;
  var H1_RE = /^\s*#\s+(.*)$/m;
  var ANSWER_H_RE = /^\s*#\s*정답/m;

  var SUBJECT_MAP = [
    [/통합과학|과학/, "science"],
    [/영어/, "english"],
    [/수학/, "math"],
    [/국어/, "korean"]
  ];

  function detectSubject(text) {
    for (var i = 0; i < SUBJECT_MAP.length; i++) {
      if (SUBJECT_MAP[i][0].test(text)) return SUBJECT_MAP[i][1];
    }
    return "unknown";
  }

  var SPLIT_OPTION_RE = /\s*([①②③④⑤])\s*/;
  var LEADING_OPTION_RE = /^\s*([①②③④⑤])\s*(.*)$/;

  function splitLineOptions(line) {
    // 줄이 원숫자로 '시작'할 때만 선지로 간주(지문 중간 numbering 은 회피).
    // 한 줄에 ①…②…③… 가 몰려 있어도 circle-number 경계로 쪼갠다.
    var lead = LEADING_OPTION_RE.exec(line);
    if (!lead) return [];
    var parts = line.split(SPLIT_OPTION_RE);
    // split 결과: ["", "①", "text", "②", "text", ...]
    var opts = [];
    for (var i = 1; i + 1 < parts.length; i += 2) {
      var num = parts[i];
      var body = (parts[i + 1] || "").trim();
      if (body) opts.push(num + " " + body);
    }
    return opts;
  }

  function parseOptionsAndPassage(lines) {
    var passage = [], options = [], inOption = false;
    for (var i = 0; i < lines.length; i++) {
      var opts = splitLineOptions(lines[i]);
      if (opts.length) {
        inOption = true;
        for (var k = 0; k < opts.length; k++) options.push(opts[k]);
      } else if (inOption) {
        continue;
      } else if (lines[i].trim()) {
        passage.push(lines[i].trim());
      }
    }
    return { passage: passage.join("\n").trim(), options: options };
  }

  function splitProblems(sectionLines) {
    var blocks = [], cur = null;
    for (var i = 0; i < sectionLines.length; i++) {
      var ln = sectionLines[i];
      var m = PROB_RE.exec(ln);
      if (m) {
        if (cur) blocks.push(cur);
        cur = { number: parseInt(m[1], 10), stem: m[2].trim(), body: [] };
      } else if (cur) {
        if (/^\s*#{1,2}\s/m.test(ln)) { blocks.push(cur); cur = null; }
        else cur.body.push(ln);
      }
    }
    if (cur) blocks.push(cur);
    return blocks;
  }

  function parseAnswerTable(lines) {
    var answers = {}, inTable = false;
    for (var i = 0; i < lines.length; i++) {
      var s = lines[i].trim();
      if (s.indexOf("|") === 0) {
        inTable = true;
        var cells = s.replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); });
        if (!cells.length) continue;
        if (cells[0] === "문항" || cells[0] === "" || /^[-: ]+$/.test(cells[0])) continue;
        var numM = /^\s*(\d+)/.exec(cells[0]);
        if (!numM) continue;
        var num = parseInt(numM[1], 10);
        var typeTier = cells[2] || "";
        var tm = TAG_RE.exec(typeTier);
        answers[num] = {
          answer: cells[1] || "",
          typeId: tm ? tm[1] : "",
          tier: tm ? tm[2] : "",
          explanation: cells[3] || ""
        };
      } else if (inTable && s) {
        break;
      }
    }
    return answers;
  }

  function splitSections(rawLines) {
    var sections = { select: [], essay: [], answer: [] };
    var cur = null;
    for (var i = 0; i < rawLines.length; i++) {
      var ln = rawLines[i];
      var s = ln.trim();
      if (s.indexOf("## 선택형") === 0) { cur = "select"; continue; }
      if (s.indexOf("## 서답형") === 0 || s.indexOf("## 서술형") === 0 || s.indexOf("## 단답형") === 0) { cur = "essay"; continue; }
      if (ANSWER_H_RE.test(ln)) { cur = "answer"; continue; }
      if (/^\s*#{1,2}\s/m.test(ln) && cur !== null && cur !== "answer") {
        if (cur === "select" || cur === "essay") cur = null;
        continue;
      }
      if (cur !== null) sections[cur].push(ln);
    }
    return sections;
  }

  function convertText(text, sourceKey) {
    var rawLines = text.split("\n");
    var title = "";
    for (var i = 0; i < rawLines.length; i++) {
      var m = H1_RE.exec(rawLines[i]);
      if (m) { title = m[1].trim(); break; }
    }
    var subject = detectSubject(title + " " + (sourceKey || ""));
    var sections = splitSections(rawLines);
    var selBlocks = splitProblems(sections.select);
    var essBlocks = splitProblems(sections.essay);
    var answers = parseAnswerTable(sections.answer);
    var problems = [];
    var all = selBlocks.concat(essBlocks);
    all.sort(function (a, b) { return a.number - b.number; });
    for (var j = 0; j < all.length; j++) {
      var blk = all[j];
      var po = parseOptionsAndPassage(blk.body);
      var qtype = po.options.length ? "choice" : "essay";
      var ans = answers[blk.number] || {};
      var stem = blk.stem;
      if (!ans.typeId) {
        var tm = TAG_RE.exec(stem);
        if (tm) { ans.typeId = tm[1]; ans.tier = tm[2]; }
      }
      problems.push({
        id: sourceKey + "#" + blk.number,
        sourceKey: sourceKey,
        subject: subject,
        number: blk.number,
        qtype: qtype,
        stem: stem.replace(/\s*\[[^\]]*\]\s*$/, "").trim(),
        passage: po.passage,
        options: po.options,
        answer: ans.answer || "",
        typeId: ans.typeId || "",
        tier: ans.tier || "",
        explanation: ans.explanation || ""
      });
    }
    return { title: title, subject: subject, problems: problems };
  }

  // 여러 md 텍스트 -> window.QUIZ_DATA 구조
  function parseAll(files) {
    // files: [{ name, text }]
    var sources = [], problems = [];
    for (var i = 0; i < files.length; i++) {
      var key = files[i].name.replace(/\.[^.]+$/, "") || ("doc" + (i + 1));
      var info = convertText(files[i].text, key);
      sources.push({ file: files[i].name, title: info.title, subject: info.subject, count: info.problems.length });
      problems = problems.concat(info.problems);
    }
    return { generatedAt: new Date().toISOString(), sources: sources, problems: problems };
  }

  window.QuizParser = { convertText: convertText, parseAll: parseAll };
})();

</script>

   "answer": "결정을 내릴 때마다 한정된 정신적 에너지가 소모되어(결정 피로) 판단력이 흐려지므로, 사소한 결정을 줄여 **가장 중요한 일에 가장 예리한 판단력을 아껴두기 위해서**.",
   "typeId": "W-03",
   "tier": "T3",
   "explanation": "부분점수: '에너지 소모' + '중요한 일에 판단력 보존'"
  },
  {
   "id": "260714#25",
   "sourceKey": "260714",
   "subject": "english",
   "number": 25,
   "qtype": "essay",
   "stem": "[서답형·영작] 다음 대화를 읽고, 전문가가 했을 조언을 **완결된 한 문장의 영어**로 쓰시오. (1번 지문의 요지를 반영할 것) [4점]",
   "passage": "> A: I try to study, check my phone, and listen to messages all at the same time, but somehow I remember almost nothing.\n> Expert: ________________________________________\n---\n---",
   "options": [],
   "answer": "(예시) \"You should focus on one task at a time, because switching between tasks leaves an 'attention residue' that weakens your memory and concentration.\"",
   "typeId": "W-04",
   "tier": "T3",
   "explanation": "1번 요지(집중) 반영 + 완결 문장"
  }
 ]
};

</script>
<script>
(function () {
  "use strict";
  var DATA = window.QUIZ_DATA || { problems: [] };
  var LS = {
    status: "quiz_status_v1",
    choice: "quiz_choice_v1",
    revealed: "quiz_revealed_v1",
    md: "quiz_md_v1",
    answer: "quiz_answer_v1"
  };
  var SUBJECT_LABEL = {
    english: "영어", science: "통합과학", math: "수학",
    korean: "국어", unknown: "기타"
  };
  function load(k) { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch (e) { return {}; } }
  function save(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
  var status = load(LS.status);
  var choice = load(LS.choice);
  var revealed = load(LS.revealed);
  var answers = load(LS.answer);

  var state = { list: [], idx: 0, shuffle: false, wrongOnly: false,
                subject: "all", type: "all" };

  // ---- DOM ----
  var $ = function (id) { return document.getElementById(id); };
  var el = {
    title: $("title"), subjectFilter: $("subjectFilter"), typeFilter: $("typeFilter"),
    loadBtn: $("loadBtn"), exportBtn: $("exportBtn"),
    shuffleBtn: $("shuffleBtn"), wrongBtn: $("wrongBtn"), resetBtn: $("resetBtn"),
    progress: $("progress"), progressFill: $("progressFill"),
    qNumber: $("qNumber"), qType: $("qType"), qTier: $("qTier"), qSource: $("qSource"),
    stem: $("stem"), passage: $("passage"), options: $("options"),
    essayBox: $("essayBox"), userAnswer: $("userAnswer"), revealBtn: $("revealBtn"),
    answerPanel: $("answerPanel"), answerText: $("answerText"),
    diffBox: $("diffBox"), autoStatus: $("autoStatus"), explanation: $("explanation"),
    markRow: $("markRow"), correctBtn: $("correctBtn"), wrongMarkBtn: $("wrongMarkBtn"),
    prevBtn: $("prevBtn"), nextBtn: $("nextBtn"), card: $("card"),
    fileInput: $("fileInput"), dropHint: $("dropHint"), dropLoadBtn: $("dropLoadBtn")
  };

  // ---- helpers ----
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function md(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  }
  function correctNum(answer) {
    var m = /^([①②③④⑤])/.exec(answer || "");
    return m ? m[1] : null;
  }
  function shuffleArr(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // ---- diff (서답형: 모범답안 기준, 구두점/공백/대소문자 무시) ----
  var WORD_RE = /[A-Za-z0-9가-힣]+/g;
  function wordsOf(text) {
    var m, out = [], re = new RegExp(WORD_RE);
    while ((m = re.exec(text)) !== null) out.push(m[0]);
    return out;
  }
  function lcsMatch(a, b) {
    var n = a.length, m = b.length, i, j;
    if (!n || !m) return new Array(n).fill(false);
    var dp = [];
    for (i = 0; i <= n; i++) dp[i] = new Array(m + 1).fill(0);
    for (i = 1; i <= n; i++) {
      for (j = 1; j <= m; j++) {
        dp[i][j] = (a[i - 1] === b[j - 1]) ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
      }
    }
    var matched = new Array(n).fill(false);
    i = n; j = m;
    while (i > 0 && j > 0) {
      if (a[i - 1] === b[j - 1]) { matched[i - 1] = true; i--; j--; }
      else if (dp[i - 1][j] >= dp[i][j - 1]) i--;
      else j--;
    }
    return matched;
  }
  function renderDiff(userText, modelText) {
    userText = (userText || "").trim();
    if (!userText) return md(modelText);
    var uWords = wordsOf(userText).map(function (w) { return w.toLowerCase(); });
    var mWords = wordsOf(modelText);
    var mNorm = mWords.map(function (w) { return w.toLowerCase(); });
    var matched = lcsMatch(mNorm, uWords);
    var re = /([A-Za-z0-9가-힣]+)|([^A-Za-z0-9가-힣])/g, out = "", m, wi = 0;
    while ((m = re.exec(modelText)) !== null) {
      if (m[1] !== undefined) {
        var raw = m[1];
        out += matched[wi] ? esc(raw) : '<span class="diff">' + esc(raw) + "</span>";
        wi++;
      } else {
        out += esc(m[2]);
      }
    }
    return out;
  }

  // ---- filters / list ----
  function buildFilters() {
    var subs = {}, types = {};
    DATA.problems.forEach(function (p) {
      subs[p.subject] = true;
      if (p.typeId) types[p.typeId] = true;
    });
    el.subjectFilter.innerHTML = '<option value="all">과목: 전체</option>' +
      Object.keys(subs).map(function (s) {
        return '<option value="' + s + '">' + (SUBJECT_LABEL[s] || s) + "</option>";
      }).join("");
    el.typeFilter.innerHTML = '<option value="all">유형: 전체</option>' +
      Object.keys(types).sort().map(function (t) {
        return '<option value="' + t + '">' + t + "</option>";
      }).join("");
    if (DATA.sources && DATA.sources[0]) el.title.textContent = DATA.sources[0].title;
  }

  function computeList() {
    var list = DATA.problems.filter(function (p) {
      if (state.subject !== "all" && p.subject !== state.subject) return false;
      if (state.type !== "all" && p.typeId !== state.type) return false;
      if (state.wrongOnly && status[p.id] !== "wrong") return false;
      return true;
    });
    if (state.shuffle) list = shuffleArr(list);
    state.list = list;
    if (state.idx >= list.length) state.idx = list.length - 1;
    if (state.idx < 0) state.idx = 0;
  }

  // ---- render ----
  function render() {
    computeList();
    var total = state.list.length;
    if (total === 0) {
      el.stem.textContent = state.wrongOnly ? "오답 노트가 비어 있습니다." : "해당 조건의 문제가 없습니다.";
      el.qNumber.textContent = ""; el.qType.textContent = ""; el.qTier.textContent = "";
      el.qSource.textContent = ""; el.passage.innerHTML = ""; el.options.innerHTML = "";
      el.essayBox.classList.add("hidden"); el.answerPanel.classList.add("hidden");
      el.progress.textContent = "0 / 0"; el.progressFill.style.width = "0%";
      return;
    }
    var p = state.list[state.idx];
    var isRev = !!revealed[p.id];

    el.qNumber.textContent = p.number + "번";
    el.qType.textContent = p.qtype === "choice" ? "객관식" : "서답형";
    el.qTier.textContent = (p.typeId || "") + (p.tier ? "·" + p.tier : "");
    el.qSource.textContent = (SUBJECT_LABEL[p.subject] || p.subject);
    el.stem.innerHTML = md(p.stem);
    el.passage.innerHTML = md(p.passage);

    el.options.innerHTML = "";
    if (p.qtype === "choice") {
      el.essayBox.classList.add("hidden");
      var cNum = correctNum(p.answer);
      var chNum = choice[p.id];
      p.options.forEach(function (opt) {
        var num = opt.charAt(0);
        var div = document.createElement("div");
        div.className = "option";
        var body = opt.slice(1).trim();
        div.innerHTML = '<span class="num">' + esc(num) + "</span><span>" + md(body) + "</span>";
        if (isRev) {
          if (num === cNum) div.classList.add("correct");
          else if (num === chNum) div.classList.add("wrong");
        } else if (num === chNum) {
          div.classList.add("chosen");
        }
        div.addEventListener("click", function (e) {
          e.stopPropagation();
          choice[p.id] = num; save(LS.choice, choice);
          revealed[p.id] = true; save(LS.revealed, revealed);
          render();
        });
        el.options.appendChild(div);
      });
    } else {
      el.essayBox.classList.remove("hidden");
      if (document.activeElement !== el.userAnswer) el.userAnswer.value = answers[p.id] || "";
    }

    // answer panel
    if (isRev) {
      el.answerPanel.classList.remove("hidden");
      el.revealBtn.classList.add("hidden");
      if (p.qtype === "choice") {
        el.answerText.innerHTML = md(p.answer);
        el.diffBox.classList.add("hidden");
        el.autoStatus.classList.remove("hidden");
        el.markRow.classList.add("hidden");
        var ch = choice[p.id];
        if (ch) {
          status[p.id] = (ch === cNum) ? "correct" : "wrong";
          save(LS.status, status);
        }
        if (!ch) { el.autoStatus.textContent = "보기를 선택하면 자동 채점됩니다"; el.autoStatus.className = "auto-status none"; }
        else if (ch === cNum) { el.autoStatus.textContent = "✅ 정답"; el.autoStatus.className = "auto-status ok"; }
        else { el.autoStatus.textContent = "❌ 오답 (정답 " + cNum + ")"; el.autoStatus.className = "auto-status no"; }
        el.explanation.innerHTML = md(p.explanation);
      } else {
        el.autoStatus.classList.add("hidden");
        el.markRow.classList.remove("hidden");
        updateEssayDiff(p);
        el.explanation.innerHTML = md(p.explanation);
        el.correctBtn.classList.toggle("active", status[p.id] === "correct");
        el.wrongMarkBtn.classList.toggle("active", status[p.id] === "wrong");
      }
    } else {
      el.answerPanel.classList.add("hidden");
      if (p.qtype === "essay") el.revealBtn.classList.remove("hidden");
    }

    el.progress.textContent = (state.idx + 1) + " / " + total;
    el.progressFill.style.width = ((state.idx + 1) / total * 100) + "%";
    el.prevBtn.disabled = state.idx === 0;
    el.nextBtn.disabled = state.idx === total - 1;
    window.scrollTo(0, 0);
  }

  function revealCurrent() {
    var p = state.list[state.idx];
    if (!p) return;
    revealed[p.id] = true; save(LS.revealed, revealed);
    render();
  }

  function updateEssayDiff(p) {
    if (!revealed[p.id]) return;
    el.answerText.innerHTML = renderDiff(answers[p.id] || "", p.answer);
    var ua = (answers[p.id] || "").trim();
    if (ua) {
      el.diffBox.classList.remove("hidden");
      el.diffBox.innerHTML = '<div class="user-answer"><span class="ua-label">내 답</span>' + esc(answers[p.id]) + "</div>";
    } else {
      el.diffBox.classList.add("hidden");
    }
  }

  function go(delta) {
    var n = state.idx + delta;
    if (n < 0 || n >= state.list.length) return;
    state.idx = n;
    render();
  }

  function mark(val) {
    var p = state.list[state.idx];
    if (!p) return;
    if (status[p.id] === val) { delete status[p.id]; }
    else { status[p.id] = val; }
    save(LS.status, status);
    render();
  }

  // ---- 단일 HTML 내보내기 (서버/Python 불필요) ----
  function exportStandalone() {
    if (!DATA.problems.length) { alert("내보낼 문제가 없습니다."); return; }
    var json = JSON.stringify(DATA).replace(/</g, "\\u003c");
    var html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    // 실제 데이터 태그만 제거 (app.js 내 동일 문자열 리터럴과 구분하기 위해
    // 바로 뒤의 window.QUIZ_DATA = 로 앵커링)
    html = html.replace(/<script id="quiz-data">\s*\nwindow\.QUIZ_DATA =[\s\S]*?<\/script>/i, "");
    var injected = "window.QUIZ_EMBEDDED = true;\nwindow.QUIZ_DATA = " + json + ";";
    html = html.replace(/(<head[^>]*>)/i, "$1\n<script>" + injected + "<\/script>");
    var blob = new Blob([html], { type: "text/html;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var base = (DATA.sources && DATA.sources[0] && DATA.sources[0].title) ? DATA.sources[0].title : "quiz";
    a.href = url; a.download = base.replace(/[\\/:*?"<>|]/g, "_") + ".html";
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 0);
  }

  // ---- MD 파일 로드 (Python 변환 없이 브라우저에서 직접) ----
  function loadFiles(fileList) {
    var files = Array.prototype.slice.call(fileList);
    if (!files.length) return;
    var pending = files.length, store = [];
    files.forEach(function (f) {
      var reader = new FileReader();
      reader.onload = function () {
        store.push({ name: f.name, text: String(reader.result || "") });
        pending--;
        if (pending === 0) finishLoad(store);
      };
      reader.readAsText(f, "utf-8");
    });
  }
  function finishLoad(store) {
    if (!store.length) return;
    DATA = window.QuizParser.parseAll(store);
    save(LS.md, store);
    buildFilters();
    state.idx = 0;
    el.dropHint.classList.add("hidden");
    render();
  }
  function restoreMd() {
    try {
      var store = JSON.parse(localStorage.getItem(LS.md));
      if (store && store.length) { DATA = window.QuizParser.parseAll(store); return true; }
    } catch (e) {}
    return false;
  }

  // ---- events ----
  el.subjectFilter.addEventListener("change", function () { state.subject = this.value; state.idx = 0; render(); });
  el.typeFilter.addEventListener("change", function () { state.type = this.value; state.idx = 0; render(); });
  el.shuffleBtn.addEventListener("click", function () {
    state.shuffle = !state.shuffle; this.classList.toggle("active", state.shuffle);
    state.idx = 0; render();
  });
  el.wrongBtn.addEventListener("click", function () {
    state.wrongOnly = !state.wrongOnly; this.classList.toggle("active", state.wrongOnly);
    state.idx = 0; render();
  });
  el.resetBtn.addEventListener("click", function () {
    if (confirm("맞음/틀림 기록과 공개 상태를 초기화할까요?")) {
      status = {}; choice = {}; revealed = {}; answers = {};
      save(LS.status, status); save(LS.choice, choice); save(LS.revealed, revealed); save(LS.answer, answers);
      render();
    }
  });
  el.revealBtn.addEventListener("click", function (e) { e.stopPropagation(); revealCurrent(); });
  el.card.addEventListener("click", function () { revealCurrent(); });
  el.correctBtn.addEventListener("click", function (e) { e.stopPropagation(); mark("correct"); });
  el.wrongMarkBtn.addEventListener("click", function (e) { e.stopPropagation(); mark("wrong"); });
  el.prevBtn.addEventListener("click", function () { go(-1); });
  el.nextBtn.addEventListener("click", function () { go(1); });
  el.exportBtn.addEventListener("click", function () { exportStandalone(); });

  // 서답형 입력
  el.userAnswer.addEventListener("click", function (e) { e.stopPropagation(); });
  el.userAnswer.addEventListener("input", function () {
    var p = state.list[state.idx];
    if (!p) return;
    answers[p.id] = el.userAnswer.value;
    save(LS.answer, answers);
    if (revealed[p.id]) updateEssayDiff(p);
  });

  el.loadBtn.addEventListener("click", function () { el.fileInput.click(); });
  el.dropLoadBtn.addEventListener("click", function () { el.fileInput.click(); });
  el.fileInput.addEventListener("change", function () { loadFiles(this.files); this.value = ""; });
  ["dragenter", "dragover"].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); el.dropHint.classList.add("dragover"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); el.dropHint.classList.remove("dragover"); });
  });
  document.addEventListener("drop", function (e) {
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
      loadFiles(e.dataTransfer.files);
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.target && /^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === "ArrowRight") { go(1); }
    else if (e.key === "ArrowLeft") { go(-1); }
    else if (e.key === " " || e.key === "Enter") { e.preventDefault(); revealCurrent(); }
  });

  // ---- init ----
  if (window.QUIZ_EMBEDDED) {
    DATA = window.QUIZ_DATA || { problems: [] };
  } else if (!restoreMd() && !(window.QUIZ_DATA && window.QUIZ_DATA.problems.length)) {
    DATA = { problems: [] };
  }
  buildFilters();
  render();
  if (!DATA.problems.length) el.dropHint.classList.remove("hidden");
})();

</script>
</body>
</html>
